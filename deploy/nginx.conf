server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html { return 301 /; }
    location = /declaration { return 301 /services/declaration/; }
    location = /declaration/ { return 301 /services/declaration/; }
    location = /declaration/index.html { return 301 /services/declaration/; }
    location = /certification { return 301 /services/certification/; }
    location = /certification/ { return 301 /services/certification/; }
    location = /certification/index.html { return 301 /services/certification/; }
    location = /voluntary { return 301 /services/voluntary/; }
    location = /voluntary/ { return 301 /services/voluntary/; }
    location = /voluntary/index.html { return 301 /services/voluntary/; }
    location = /specifications { return 301 /services/specifications/; }
    location = /specifications/ { return 301 /services/specifications/; }
    location = /specifications/index.html { return 301 /services/specifications/; }

    error_page 404 /404.html;

    location ^~ /documents/ {
        add_header X-Robots-Tag "noindex";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ ^/(app|style)\.[0-9a-f]{12}\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ~ ^/(app\.js|style\.css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ~* \.(css|js|json|svg|png|jpe?g|webp|gif|ico|ttf|woff2?)$ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
